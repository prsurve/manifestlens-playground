name: Canary

# Runs the published action against fixed manifests and asserts exact counts.
# Catches a release or a runner image change (e.g. ubuntu-latest moving to Ubuntu 26) breaking the action.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  v1:
    name: "@v1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Hardened manifest has no findings
        id: good
        uses: prsurve/manifestlens@v1
        with:
          paths: k8s/good/**
          mode: report
          annotations: false
          comment: never
      - env:
          ACTUAL_findings: ${{ steps.good.outputs.findings }}
          ACTUAL_passed: ${{ steps.good.outputs.passed }}
          ACTUAL_files_checked: ${{ steps.good.outputs.files-checked }}
        run: scripts/assert.sh good findings=0 passed=true files-checked=1

      - name: Risky manifest has the known findings
        id: bad
        uses: prsurve/manifestlens@v1
        with:
          paths: k8s/bad/**
          mode: report
          annotations: false
          comment: never
      - env:
          ACTUAL_errors: ${{ steps.bad.outputs.errors }}
          ACTUAL_warnings: ${{ steps.bad.outputs.warnings }}
          ACTUAL_infos: ${{ steps.bad.outputs.infos }}
          ACTUAL_findings: ${{ steps.bad.outputs.findings }}
          ACTUAL_result: ${{ steps.bad.outputs.result }}
        run: scripts/assert.sh bad errors=2 warnings=9 infos=5 findings=16 result=report

      - name: Enforce mode fails on the risky manifest
        id: enforce
        uses: prsurve/manifestlens@v1
        continue-on-error: true
        with:
          paths: k8s/bad/**
          annotations: false
          comment: never
      - env:
          ACTUAL_outcome: ${{ steps.enforce.outcome }}
          ACTUAL_result: ${{ steps.enforce.outputs.result }}
        run: scripts/assert.sh enforce outcome=failure result=fail

      - name: Excluding the legacy folder drops its findings
        id: legacy
        uses: prsurve/manifestlens@v1
        with:
          paths: |
            k8s/**
            !k8s/legacy/**
            !k8s/complex/**
            !k8s/crd/**
          mode: report
          annotations: false
          comment: never
      - env:
          ACTUAL_files_checked: ${{ steps.legacy.outputs.files-checked }}
          ACTUAL_errors: ${{ steps.legacy.outputs.errors }}
          ACTUAL_warnings: ${{ steps.legacy.outputs.warnings }}
          ACTUAL_infos: ${{ steps.legacy.outputs.infos }}
        run: scripts/assert.sh legacy files-checked=3 errors=2 warnings=13 infos=8

